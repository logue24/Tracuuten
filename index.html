<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tra Cứu Thông Tin</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔎</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="document">
    <div class="letterhead">
      <div class="emblem" aria-hidden="true"></div>
      <div>
        <h1>Tra Cứu Thông Tin</h1>
        <p>Nhập mã số để mở hồ sơ</p>
      </div>
    </div>

    <div class="form-section">
      <label class="eyebrow" for="search-input">Mã số</label>
      <div class="search-row">
        <input type="text" id="search-input" autocomplete="off" disabled>
        <button id="search-btn" disabled>Tra cứu</button>
      </div>
    </div>

    <p id="status" class="status">Đang tải dữ liệu…</p>

    <div id="results" class="results"></div>

    <div class="footer">
      <span>Cập nhật lần cuối: <strong id="updated-time">—</strong></span>
      <span>Tổng số hồ sơ: <strong id="record-count">0</strong></span>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
